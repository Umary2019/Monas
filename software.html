<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f78df">
  <meta name="description" content="MONAS Table Water sales, inventory, and operations management.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>MONAS Table Water · Operations</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #4f76df;
      --blue-dark: #3159bc;
      --ink: #26354e;
      --muted: #78869b;
      --line: #e4e9f1;
      --canvas: #f5f7fb;
      --white: #fff;
      --green: #23845f;
      --red: #b94350;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: var(--canvas); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #8eabff; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #f5f6f8; }
    .login-card { display: grid; grid-template-columns: 1fr 1fr; width: min(940px, 100%); min-height: 440px; overflow: hidden; border-radius: 9px; background: white; box-shadow: 0 16px 45px #17233b1c; }
    .login-photo { display: grid; place-items: center; padding: 32px; color: white; background: linear-gradient(140deg, #1d2b37, #42647a 55%, #172630); }
    .login-photo-inner { text-align: center; }
    .computer { display: grid; width: 240px; height: 190px; place-items: center; margin: 0 auto 28px; border: 12px solid #d6dbe0; border-bottom-width: 23px; border-radius: 8px; background: linear-gradient(135deg,#dceaff,#fff 55%,#c4d5f3); box-shadow: 0 14px 0 -7px #8a9299; }
    .computer-screen { width: 100%; padding: 19px 14px; color: #35558e; font-size: 15px; font-weight: 800; letter-spacing: .12em; }
    .computer-screen span { display: block; height: 8px; margin-top: 9px; border-radius: 8px; background: #b4c6ec; }
    .login-caption { color: #dbe5f2; font-size: 12px; }
    .login-form-wrap { display: flex; flex-direction: column; justify-content: center; padding: 40px clamp(28px, 7vw, 65px); }
    .login-brand { margin: 0 0 55px; color: #79869a; font-size: 21px; font-weight: 350; text-align: center; }
    .login-form-wrap h1 { margin: 0 0 21px; font-size: 20px; font-weight: 500; text-align: center; }
    .login-field { width: 100%; height: 47px; margin-bottom: 12px; padding: 0 15px; border: 1px solid #d9deea; border-radius: 24px; color: var(--ink); background: #fff; font-size: 12px; }
    .login-submit { height: 43px; margin-top: 3px; border: 0; border-radius: 24px; color: white; background: var(--blue); font-size: 12px; }
    .login-submit:hover { background: var(--blue-dark); }
    .login-hint { margin: 15px 0 0; color: #8b95a5; font-size: 10px; line-height: 1.5; text-align: center; }
    .login-error { margin: 0 0 10px; color: var(--red); font-size: 12px; text-align: center; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 5; display: flex; width: 254px; flex-direction: column; padding: 23px 15px 16px; color: #d7e1f4; background: #182b4b; box-shadow: 4px 0 18px #17233b12; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 24px; border-bottom: 1px solid #ffffff17; }
    .brand > span:last-child { min-width: 0; }
    .brand-mark { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; color: white; background: #4f76df; font-size: 16px; font-weight: 800; }
    .brand-name { display: block; color: white; font-size: 13px; font-weight: 750; letter-spacing: .04em; }
    .brand-caption { display: block; margin-top: 3px; color: #aab8d2; font-size: 10px; }
    .nav { display: grid; align-content: start; gap: 3px; min-height: 0; margin: 17px -4px 14px; overflow-y: auto; scrollbar-color: #607496 transparent; scrollbar-width: thin; }
    .nav-group { display: grid; gap: 3px; }
    .nav-group + .nav-group { margin-top: 9px; }
    .nav-label { padding: 6px 12px 5px; color: #8ea0bf; font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .nav button { display: flex; min-height: 39px; align-items: center; gap: 11px; padding: 0 11px; border: 0; border-radius: 7px; color: #c3cee2; background: transparent; font-size: 11px; text-align: left; }
    .nav button:hover { color: white; background: #ffffff10; }
    .nav button.active { color: white; background: #30466d; box-shadow: inset 3px 0 #83a1ff; }
    .nav-icon { display: grid; width: 18px; flex: 0 0 18px; place-items: center; color: #9fb3d7; font-size: 14px; }
    .nav button.active .nav-icon { color: #a9bdff; }
    .sidebar-footer { display: grid; gap: 11px; margin-top: auto; padding: 14px 8px 0; border-top: 1px solid #ffffff17; }
    .user-menu { display: flex; min-width: 0; align-items: center; gap: 9px; color: #e9eef8; font-size: 11px; }
    .user-avatar { display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center; border-radius: 50%; color: #dce6ff; background: #344d76; font-size: 11px; font-weight: 700; }
    .user-details { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-details small { display: block; margin-top: 3px; color: #9eafca; font-size: 9px; }
    .user-menu button { width: 100%; min-height: 34px; border: 1px solid #ffffff30; border-radius: 6px; color: #e5ebf7; background: #ffffff08; font-size: 10px; }
    .user-menu button:hover { background: #ffffff15; }
    .workspace { min-height: 100vh; margin-left: 254px; }
    .content { width: min(1480px, 100%); margin: 0 auto; padding: 34px clamp(20px, 3vw, 46px) 52px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; padding-bottom: 19px; border-bottom: 1px solid #e6eaf1; }
    .page-heading h1 { margin: 0; color: #273750; font-size: clamp(22px, 2vw, 27px); font-weight: 700; letter-spacing: -.035em; }
    .page-heading p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .btn { min-height: 36px; padding: 0 13px; border: 1px solid #dce2ed; border-radius: 6px; color: #52617a; background: white; font-size: 11px; transition: border-color .15s, background .15s, color .15s; }
    .btn:hover { border-color: #9eb4ee; color: #365ab8; background: #f8faff; }
    .btn.primary { border-color: var(--blue); color: white; background: var(--blue); box-shadow: 0 3px 8px #4f76df25; }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.danger { color: var(--red); }
    .btn:disabled { cursor: not-allowed; opacity: .5; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat-card { min-width: 0; min-height: 100px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 9px; background: white; box-shadow: 0 3px 12px #162b4b08; }
    .stat-label { color: #738099; font-size: 10px; font-weight: 650; letter-spacing: .045em; text-transform: uppercase; }
    .stat-number { margin-top: 14px; overflow-wrap: anywhere; color: #31435f; font-size: 22px; font-weight: 720; letter-spacing: -.025em; }
    .stat-number.small { font-size: 17px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    .dash-card { display: flex; min-width: 0; min-height: 132px; flex-direction: column; border: 1px solid var(--line); border-radius: 9px; background: white; box-shadow: 0 3px 12px #1c31500a; }
    .dash-card-body { flex: 1; padding: 18px 16px 14px; }
    .dash-card h2 { margin: 0; color: #60708a; font-size: 10px; font-weight: 700; letter-spacing: .055em; line-height: 1.45; text-transform: uppercase; }
    .dash-card p { margin: 9px 0 0; color: #77849a; font-size: 11px; line-height: 1.5; }
    .dash-card strong { display: block; margin-top: 13px; overflow-wrap: anywhere; color: #364966; font-size: 19px; font-weight: 700; }
    .dash-card a { padding: 10px 15px; border-top: 1px solid #edf0f5; color: #5375d1; font-size: 10px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .dash-card a:hover { background: #f7f9ff; }
    .panel { min-width: 0; margin-bottom: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: white; box-shadow: 0 3px 12px #1c31500a; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; color: #34445e; font-size: 14px; font-weight: 680; }
    .panel-head p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 16px 19px; }
    .control { min-height: 36px; padding: 0 10px; border: 1px solid #dce2eb; border-radius: 5px; color: #46556d; background: white; font-size: 11px; }
    .toolbar .control { min-width: 150px; }
    .field { display: grid; min-width: 0; gap: 6px; color: #4c5a70; font-size: 10px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; min-height: 37px; padding: 0 10px; border: 1px solid #dce2eb; border-radius: 5px; color: #46556d; background: white; font-size: 11px; }
    .field textarea { min-height: 90px; padding-top: 9px; resize: vertical; }
    .table-wrap { width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { height: 42px; padding: 0 12px; border-bottom: 1px solid #e4e8ef; color: #6a778d; background: #f8f9fc; font-size: 9px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 12px; border-bottom: 1px solid #edf0f4; color: #4e5d73; font-size: 11px; vertical-align: middle; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: #fbfcfe; }
    tbody tr:hover { background: #f7f9fd; }
    .empty-row { padding: 32px 18px; color: #7b8798; text-align: center; }
    .badge { display: inline-block; padding: 5px 8px; border-radius: 14px; color: #237b58; background: #e8f7f0; font-size: 9px; font-weight: 650; }
    .badge.pending { color: #96651b; background: #fff4df; }
    .form-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); align-items: end; gap: 14px; padding: 20px; }
    .form-grid .wide { grid-column: span 2; }
    .cart-total { padding: 15px 20px; color: #3859ae; font-size: 13px; font-weight: 700; text-align: right; }
    .pagination { display: flex; justify-content: space-between; gap: 10px; padding: 13px 19px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .hint { margin: 12px 18px; padding: 12px 14px; border: 1px solid #dfe7fa; border-radius: 6px; color: #5d6e8d; background: #f5f8ff; font-size: 11px; line-height: 1.55; }
    dialog { width: min(540px, calc(100vw - 28px)); max-height: 90vh; padding: 0; border: 0; border-radius: 10px; box-shadow: 0 18px 55px #17233b44; }
    dialog::backdrop { background: #15213a80; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 16px; }
    .modal-body { display: grid; gap: 14px; padding: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 19px; border-top: 1px solid var(--line); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 8; max-width: min(390px, calc(100vw - 36px)); padding: 13px 16px; border: 1px solid #dce5f8; border-radius: 7px; color: #344764; background: white; box-shadow: 0 5px 20px #17233b22; font-size: 11px; }
    .toast.error { border-color: #efc8ce; color: #9e303d; }
    .muted { color: var(--muted); }
    .mobilebar, .sidebar-scrim { display: none; }
    .entity-table { margin-bottom: 18px; }
    .entity-table .table-wrap td:last-child { white-space: nowrap; }
    @media (max-width: 1100px) {
      .sidebar { width: 228px; }
      .workspace { margin-left: 228px; }
      .content { padding-right: 24px; padding-left: 24px; }
      .dashboard-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 760px) {
      .sidebar { width: min(290px, 84vw); transform: translateX(-105%); transition: transform .22s ease; }
      .app.sidebar-open .sidebar { transform: translateX(0); }
      .workspace { margin-left: 0; }
      .mobilebar { position: sticky; top: 0; z-index: 4; display: flex; height: 58px; align-items: center; gap: 12px; padding: 0 17px; border-bottom: 1px solid var(--line); background: #fff; box-shadow: 0 2px 8px #182b4b0a; }
      .mobilebar button { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: #3e5376; background: #fff; font-size: 18px; }
      .mobilebar strong { color: #283a56; font-size: 12px; letter-spacing: .04em; }
      .sidebar-scrim { position: fixed; inset: 0; z-index: 4; display: block; border: 0; background: #101b2c70; }
      .content { padding: 25px 20px 40px; }
      .form-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 540px) {
      .login-card { grid-template-columns: 1fr; }
      .login-photo { display: none; }
      .login-form-wrap { min-height: 400px; padding: 30px 25px; }
      .login-brand { margin-bottom: 35px; }
      .content { padding: 22px 14px 32px; }
      .page-heading { align-items: stretch; flex-direction: column; gap: 14px; margin-bottom: 19px; }
      .page-heading .actions { justify-content: flex-start; }
      .page-heading .actions .btn { flex: 1 1 auto; }
      .stats, .dashboard-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .stat-card { min-height: 84px; padding: 12px; }
      .stat-label { font-size: 9px; line-height: 1.4; }
      .stat-number { margin-top: 10px; font-size: 17px; }
      .stat-number.small { font-size: 14px; }
      .dash-card { min-height: 125px; }
      .dash-card-body { padding: 14px 12px 11px; }
      .dash-card h2 { font-size: 9px; }
      .dash-card strong { margin-top: 11px; font-size: 16px; }
      .dash-card p { font-size: 10px; }
      .panel-head, .toolbar { padding-right: 13px; padding-left: 13px; }
      .form-grid { grid-template-columns: 1fr 1fr; gap: 11px; padding: 14px; }
      .form-grid .wide { grid-column: span 2; }
      .field { font-size: 9px; }
      .table-wrap table { min-width: 650px; }
      .pagination { align-items: flex-start; flex-direction: column; padding: 12px 14px; }
      .toolbar .control { min-width: 0; width: 100%; }
      .toolbar .field { flex: 1 1 135px; }
      .modal-head, .modal-body { padding-right: 16px; padding-left: 16px; }
      .modal-actions { padding-right: 16px; padding-left: 16px; }
    }
    @media (max-width: 360px) {
      .stats, .dashboard-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .wide { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <section class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-photo" aria-hidden="true">
        <div class="login-photo-inner"><div class="computer"><div class="computer-screen">MONAS<span></span><span></span><span></span></div></div><div class="login-caption">MONAS Table Water Operations</div></div>
      </div>
      <div class="login-form-wrap">
        <p class="login-brand">MONAS TABLE WATER</p>
        <h1>USER LOGIN</h1>
        <form id="login-form">
          <div class="login-error" id="login-error" role="alert" hidden></div>
          <input class="login-field" id="login-username" name="username" autocomplete="username" placeholder="Enter Username here..." required maxlength="60" aria-label="Username">
          <input class="login-field" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter Password here..." required aria-label="Password">
          <button class="login-submit" type="submit">Login</button>
        </form>
        <p class="login-hint">Sign-in is checked in this browser. For real account security, host this system with server-side authentication.</p>
      </div>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="MONAS workspace navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><span class="brand-name">MONAS</span><span class="brand-caption">Table Water · Operations</span></span>
      </div>
      <nav class="nav" id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <div class="user-menu">
          <span class="user-avatar" id="user-avatar" aria-hidden="true">M</span>
          <span class="user-details" id="welcome-user">User<small>MONAS account</small></span>
        </div>
        <button type="button" id="logout-button">Log out</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="mobilebar">
        <button type="button" id="sidebar-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
        <strong>MONAS TABLE WATER</strong>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="record-dialog" aria-labelledby="modal-title">
    <form id="record-form">
      <div class="modal-head"><h2 id="modal-title"></h2><button class="btn" type="button" data-close-modal aria-label="Close">×</button></div>
      <div class="modal-body" id="modal-fields"></div>
      <div class="modal-actions"><button class="btn" type="button" data-close-modal>Cancel</button><button class="btn primary" type="submit">Save</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    (() => {
      "use strict";
      const DATA_KEY = "monas.operations.v1";
      const SESSION_KEY = "monas.operations.session";
      const ACCOUNTS = [
        { name: "Muhammad Nasir Abdulhakeem", username: "admin", password: "12345678", role: "admin" },
        { name: "Nasir Muhammad", username: "manager", password: "12345678", role: "manager" }
      ];
      const n = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const money = value => `₦ ${n.format(Number(value) || 0)}`;
      const stamp = () => new Date().toISOString();
      const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const initialMaterials = [
        { id: "rm-28-micro", name: "28 MICRO", quantityKg: 91, pricePerKg: 3000, location: "MAIN STORE" },
        { id: "rm-30-micro", name: "30 MICRO", quantityKg: 553, pricePerKg: 3000, location: "MAIN STORE" },
        { id: "rm-35-micro", name: "35 MICRO", quantityKg: 4807.1, pricePerKg: 3637.91, location: "MAIN STORE" },
        { id: "rm-packing-bags", name: "PACKING BAGS", quantityKg: 566, pricePerKg: 2000, location: "MAIN STORE" }
      ];
      const blankState = () => ({
        products: [], customers: [], suppliers: [], stores: [], invoices: [], expenses: [], staff: [], users: [],
        materials: initialMaterials, allocations: [], qualityChecks: []
      });
      let state = blankState();
      let currentUser = { name: "", role: "admin" };
      let currentPage = "dashboard";
      let cart = [];
      let saleCustomer = "";
      let saleAmountPaid = "";
      let modalSave = null;
      let toastTimer;
      const navItems = [
        ["dashboard", "Dashboard"], ["invoices", "Manage Invoice"], ["sales", "Sales"], ["customers", "Customers"],
        ["products", "Products"], ["raw-materials", "Manage RM"], ["allocations", "Allocate RM to Factory"],
        ["factory", "Factory"], ["quality", "Quality Control"], ["stores", "Store"], ["expenses", "Expenses"],
        ["suppliers", "Suppliers"], ["reports", "Reports"], ["users", "User"], ["settings", "Settings"]
      ];
      const navGroups = [
        ["Workspace", ["dashboard"]],
        ["Sales", ["sales", "invoices"]],
        ["People", ["customers", "suppliers", "users"]],
        ["Inventory", ["products", "raw-materials", "stores"]],
        ["Production", ["allocations", "factory", "quality"]],
        ["Finance", ["expenses", "reports"]],
        ["System", ["settings"]]
      ];
      const navIcons = {
        dashboard: "◫", sales: "＋", invoices: "▤", customers: "♙", suppliers: "⇄",
        users: "♧", products: "◇", "raw-materials": "▦", stores: "▣", allocations: "↗",
        factory: "⌂", quality: "✓", expenses: "−", reports: "▥", settings: "⚙"
      };
      const view = document.querySelector("#view");
      const nav = document.querySelector("#nav");
      const dialog = document.querySelector("#record-dialog");
      const today = new Date().toISOString().slice(0, 10);

      function notify(message, error = false) {
        const toast = document.querySelector("#toast");
        toast.textContent = message;
        toast.classList.toggle("error", error);
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(DATA_KEY);
          if (raw === null) {
            const oldStores = localStorage.getItem("monas.stores.v1");
            if (oldStores) {
              const parsedStores = JSON.parse(oldStores);
              if (Array.isArray(parsedStores)) state.stores = parsedStores;
            }
            return;
          }
          const saved = JSON.parse(raw);
          if (!saved || typeof saved !== "object") throw new Error("Saved data has an unexpected format.");
          for (const key of Object.keys(state)) {
            if (Array.isArray(saved[key])) state[key] = saved[key];
          }
        } catch (error) {
          console.error("Could not load MONAS data:", error);
          notify("Could not load saved records. Check browser storage and reload.", true);
        }
      }

      function persist() {
        try {
          localStorage.setItem(DATA_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          console.error("Could not save MONAS data:", error);
          notify("Could not save changes. Check that browser storage is enabled and has space.", true);
          return false;
        }
      }

      function commit(message) {
        if (persist()) {
          render();
          if (message) notify(message);
        }
      }

      function dateLabel(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "—" : date.toLocaleDateString();
      }

      function id() {
        return crypto.randomUUID ? crypto.randomUUID() : `monas-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function navMarkup() {
        const labels = new Map(navItems);
        nav.innerHTML = navGroups.map(([group, keys]) =>
          `<section class="nav-group"><div class="nav-label">${esc(group)}</div>${keys.map(key =>
            `<button type="button" data-page="${key}" class="${currentPage === key ? "active" : ""}" ${currentPage === key ? 'aria-current="page"' : ""}><span class="nav-icon" aria-hidden="true">${navIcons[key]}</span><span>${esc(labels.get(key))}</span></button>`
          ).join("")}</section>`
        ).join("");
      }

      function heading(title, description = "", button = "") {
        return `<div class="page-heading"><div><h1>${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ""}</div>${button ? `<div class="actions">${button}</div>` : ""}</div>`;
      }

      function stat(label, value, small = false) {
        return `<article class="stat-card"><div class="stat-label">${esc(label)}</div><div class="stat-number${small ? " small" : ""}">${esc(value)}</div></article>`;
      }

      function dashCard(label, main, sub = "", link = "") {
        return `<article class="dash-card"><div class="dash-card-body"><h2>${esc(label)}</h2>${main ? `<strong>${esc(main)}</strong>` : ""}${sub ? `<p>${esc(sub)}</p>` : ""}</div>${link ? `<a data-page="${esc(link)}">Break Down</a>` : ""}</article>`;
      }

      function table(headers, rows, emptyText = "No data available in table") {
        return `<div class="table-wrap"><table><thead><tr>${headers.map(item => `<th>${esc(item)}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.join("") : `<tr><td class="empty-row" colspan="${headers.length}">${esc(emptyText)}</td></tr>`}</tbody></table></div>`;
      }

      function row(cells) {
        return `<tr>${cells.map(cell => `<td>${cell}</td>`).join("")}</tr>`;
      }

      function renderDashboard() {
        const products = state.products.length;
        const customers = state.customers.length;
        const activeInvoices = state.invoices.filter(item => new Date(item.date).toISOString().slice(0, 7) === today.slice(0, 7));
        const todayInvoices = state.invoices.filter(item => item.date.slice(0, 10) === today);
        const salesTotal = activeInvoices.reduce((sum, item) => sum + Number(item.total || 0), 0);
        const todaySales = todayInvoices.reduce((sum, item) => sum + Number(item.total || 0), 0);
        const expenses = state.expenses.filter(item => item.date === today).reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const dailyDeposits = todayInvoices.reduce((sum, item) => sum + Number(item.amountPaid || 0), 0);
        const supplierBalance = state.suppliers.reduce((sum, item) => sum + Number(item.balance || 0), 0);
        const inventoryValue = state.materials.reduce((sum, item) => sum + Number(item.quantityKg || 0) * Number(item.pricePerKg || 0), 0);
        const stockQuantity = state.materials.reduce((sum, item) => sum + Number(item.quantityKg || 0), 0);
        const counts = `<section class="stats">${stat("Store", state.stores.length)}${stat("Products", products)}${stat("Customers", customers)}${stat("Invoice count this month", activeInvoices.length)}</section>`;
        if (currentUser.role === "manager") {
          return heading("Manager Dashboard", "MONAS Table Water · Operations overview") + counts +
            `<section class="dashboard-grid">${dashCard("Today's sales in cash", money(todayInvoices.filter(x => x.paymentMethod === "Cash").reduce((s,x) => s + x.amountPaid,0)), "", "reports")}${dashCard("Today's sales at bank", money(todayInvoices.filter(x => x.paymentMethod === "Bank").reduce((s,x) => s + x.amountPaid,0)), "", "reports")}${dashCard("Today's POS sales", money(todayInvoices.filter(x => x.paymentMethod === "POS").reduce((s,x) => s + x.amountPaid,0)), "", "reports")}${dashCard("Total deposit", "", `Today's deposit: ${money(dailyDeposits)} · Current month: ${money(activeInvoices.reduce((s,x) => s + Number(x.amountPaid || 0),0))}`, "invoices")}${dashCard("Total cash expenses", money(expenses), "", "expenses")}${dashCard("Total bank expenses", money(state.expenses.filter(x => x.date.slice(0, 7) === today.slice(0, 7) && x.method === "Bank").reduce((s,x) => s + Number(x.amount || 0),0)), "", "expenses")}${dashCard("Suppliers balance", money(supplierBalance), "", "suppliers")}${dashCard("Staff", String(state.users.length), "", "users")}</section>`;
        }
        return heading("Admin Dashboard", "MONAS Table Water · Business overview") + counts +
          `<section class="dashboard-grid">${dashCard("Inventory value", money(inventoryValue), `Raw material: ${n.format(stockQuantity)} kg`, "raw-materials")}${dashCard("General overview", "", `Cost of production: ${money(state.allocations.reduce((s,x) => s + Number(x.cost || 0),0))}`, "reports")}${dashCard("General credit", money(state.invoices.reduce((s,x) => s + Math.max(0, Number(x.total || 0) - Number(x.amountPaid || 0)),0)), "", "invoices")}${dashCard("This month credit", money(activeInvoices.reduce((s,x) => s + Math.max(0, Number(x.total || 0) - Number(x.amountPaid || 0)),0)), "", "invoices")}${dashCard("Total released sales", "", `Today's sales: ${money(todaySales)} · Monthly sales: ${money(salesTotal)}`, "reports")}${dashCard("Total deposit", "", `Today's deposit: ${money(dailyDeposits)} · Current month: ${money(activeInvoices.reduce((s,x) => s + Number(x.amountPaid || 0),0))}`, "reports")}${dashCard("Total expenses", "", `Today's expenses: ${money(expenses)} · Current month: ${money(state.expenses.filter(x => x.date.slice(0, 7) === today.slice(0, 7)).reduce((s,x) => s + Number(x.amount || 0),0))}`, "expenses")}${dashCard("Total cash-out", "", `Today's cash-out: ${money(expenses)} · Current month: ${money(state.expenses.filter(x => x.date.slice(0, 7) === today.slice(0, 7)).reduce((s,x) => s + Number(x.amount || 0),0))}`, "expenses")}</section><section class="stats" style="margin-top:14px">${stat("Total cash expenses", money(expenses), true)}${stat("Staff", state.users.length, true)}${stat("Suppliers balance", money(supplierBalance), true)}${stat("Suppliers", state.suppliers.length, true)}</section>`;
      }

      function renderSales() {
        const productOptions = state.products.map((item, index) => `<option value="${esc(item.id)}" data-price="${Number(item.salePrice) || 0}">${esc(item.name)}</option>`).join("");
        const storeOptions = state.stores.length ? state.stores.map(item => `<option value="${esc(item.name)}">${esc(item.name)}</option>`).join("") : `<option value="MAIN STORE">MAIN STORE</option>`;
        const customerOptions = state.customers.map(item => `<option value="${esc(item.name)}" ${saleCustomer === item.name ? "selected" : ""}>${esc(item.name)}</option>`).join("");
        const rows = cart.map((item, index) => row([String(index + 1), esc(item.name), n.format(item.quantity), money(item.price), money(item.quantity * item.price), `<button class="btn danger" data-action="remove-cart" data-index="${index}">Remove</button>`]));
        const total = cart.reduce((sum, item) => sum + item.quantity * item.price, 0);
        return heading("Sales Management", "Build a sales cart, select a customer, and record payment.") +
          (!state.products.length ? `<div class="hint">Add products before creating a sale. Use the Products menu to set up your catalogue.</div>` : "") +
          `<section class="panel"><div class="form-grid">
            <label class="field">Product / Quantity<select class="control" id="sale-product"><option value="">Select Product</option>${productOptions}</select></label>
            <label class="field">Store<select class="control" id="sale-store"><option value="">Select Store</option>${storeOptions}</select></label>
            <label class="field">Quantity<input class="control" id="sale-quantity" type="number" min="0.01" step="0.01" placeholder="Qty"></label>
            <label class="field">Sale Price<input class="control" id="sale-price" type="number" min="0" step="0.01" placeholder="Sale Price"></label>
            <label class="field">Total<input class="control" id="sale-line-total" readonly placeholder="Total"></label>
            <button type="button" class="btn primary" id="add-to-cart">Add to Cart</button>
          </div><div class="panel-head"><h2>Cart List</h2></div>
          ${table(["S/N", "Product", "Qty", "Unit price", "Amount", "Action"], rows, "Your cart is empty.")}<div class="cart-total">Total Amount: ${money(total)}</div>
          <div class="form-grid">
            <label class="field">Select Customer<select class="control" id="sale-customer"><option value="">Select Customer</option>${customerOptions}</select></label>
            <label class="field">Amount Paid<input class="control" id="sale-paid" type="number" min="0" step="0.01" value="${esc(saleAmountPaid)}" placeholder="Amount paid"></label>
            <label class="field">Payment Method<select class="control" id="sale-method"><option>Cash</option><option>Bank</option><option>POS</option></select></label>
            <button type="button" class="btn primary" id="submit-sale" ${cart.length ? "" : "disabled"}>Submit Sale</button>
          </div></section>`;
      }

      function renderInvoices() {
        const invoices = state.invoices.filter(invoice => {
          const query = (document.querySelector("#invoice-search")?.value || "").trim().toLowerCase();
          const start = document.querySelector("#invoice-start")?.value || "";
          const end = document.querySelector("#invoice-end")?.value || "";
          const date = invoice.date.slice(0, 10);
          return (!query || `${invoice.invoiceId} ${invoice.customer}`.toLowerCase().includes(query))
            && (!start || date >= start) && (!end || date <= end);
        });
        const rows = invoices.map((invoice, index) => `<tr data-date="${esc(invoice.date.slice(0, 10))}">${[index + 1, esc(invoice.invoiceId), esc(invoice.customer), dateLabel(invoice.date), money(invoice.total), money(invoice.amountPaid), esc(invoice.paymentMethod), esc(invoice.user), `<span class="badge${invoice.amountPaid < invoice.total ? " pending" : ""}">${invoice.amountPaid < invoice.total ? "Credit" : "Paid"}</span>`, `<button class="btn" data-action="print-invoice" data-id="${esc(invoice.id)}">PDF / Print</button>`].map(cell => `<td>${cell}</td>`).join("")}</tr>`);
        return heading("Manage Invoice", "Review, search, and print customer invoices.") +
          `<section class="panel"><div class="toolbar">
            <label class="field">Start Date<input class="control" id="invoice-start" type="date"></label>
            <label class="field">End Date<input class="control" id="invoice-end" type="date"></label>
            <button class="btn primary" id="invoice-search-button" type="button">Search</button>
            <label class="field" style="margin-left:auto">Search<input class="control" id="invoice-search" type="search" placeholder="Invoice or customer"></label>
          </div><div id="invoice-table">${table(["S/N", "Invoice ID", "Customer name", "Date/time", "Total", "Amount paid", "Payment", "User", "Status", "Export PDF"], rows, "No data available in table")}</div><div class="pagination"><span>Showing ${rows.length ? `1 to ${rows.length} of ${rows.length}` : "0 to 0 of 0"} entries</span><span>Previous　 Next</span></div></section>`;
      }

      function renderMaterials() {
        const rows = state.materials.map((item, index) => row([index + 1, esc(item.name), n.format(item.quantityKg), n.format(item.quantityKg / 1000), money(item.pricePerKg), esc(item.location), `<button class="btn" data-action="edit-material" data-id="${esc(item.id)}">Edit</button> <button class="btn danger" data-action="delete-material" data-id="${esc(item.id)}">Delete</button>`]));
        return heading("Raw Material", "Track material quantity, value, and store location.", `<button class="btn primary" data-action="add-material">Add New RM Name</button>`) +
          `<section class="panel"><div class="panel-head"><div><h2>Raw Material</h2><p>${state.materials.length} materials in inventory</p></div></div><div class="toolbar"><label class="field">Search<input class="control" data-table-search="materials" type="search" placeholder="Search raw materials"></label></div><div id="materials-table">${table(["S/N", "Material name", "Quantity (kg)", "Quantity (ton)", "Price (per kg)", "Store/location", "Options"], rows, "No raw materials found.")}</div><div class="pagination"><span>Showing 1 to ${state.materials.length} of ${state.materials.length} entries</span><span>Previous　 1　 Next</span></div></section>`;
      }

      function renderStores() {
        const rows = state.stores.map((item, index) => `<tr data-store-search="${esc(`${item.name} ${item.type} ${item.keeper} ${item.description}`.toLowerCase())}">${[index + 1, `<strong>${esc(item.name)}</strong>${item.description ? `<br><span class="muted">${esc(item.description)}</span>` : ""}`, esc(item.type === "finished" ? "Finished product" : item.type === "raw" ? "Raw material" : item.type || "—"), esc(item.keeper || "Unassigned"), `<span class="badge${item.status === "inactive" ? " pending" : ""}">${esc(item.status || "Active")}</span>`, dateLabel(item.updatedAt), `<button class="btn" data-action="edit-store" data-id="${esc(item.id)}">Edit</button> <button class="btn danger" data-action="delete-store" data-id="${esc(item.id)}">Delete</button>`].map(cell => `<td>${cell}</td>`).join("")}</tr>`);
        return heading("Store Management", "Manage finished product and raw-material store locations.", `<button class="btn" data-action="export-stores">Export CSV</button><button class="btn primary" data-action="add-store">Add Store</button>`) +
          `<section class="panel"><div class="toolbar"><label class="field">Search stores<input class="control" data-table-search="stores" type="search" placeholder="Search name, keeper, or description"></label></div>${table(["S/N", "Store name", "Store type", "Store keeper", "Status", "Last updated", "Options"], rows, "No stores available.")}</section>`;
      }

      const entityConfig = {
        products: { title: "Products", description: "Maintain the product catalogue used by sales.", fields: [["name", "Product name", "text"], ["salePrice", "Sale price (₦)", "number"], ["stock", "Stock quantity", "number"]] },
        customers: { title: "Customers", description: "Manage customer names and contact information.", fields: [["name", "Customer name", "text"], ["phone", "Phone number", "tel"], ["address", "Address", "text"]] },
        suppliers: { title: "Suppliers", description: "Manage supplier contacts and outstanding balances.", fields: [["name", "Supplier name", "text"], ["phone", "Phone number", "tel"], ["balance", "Balance (₦)", "number"]] },
        expenses: { title: "Expenses", description: "Record operating expenses and payment methods.", fields: [["description", "Expense description", "text"], ["amount", "Amount (₦)", "number"], ["method", "Payment method (Cash/Bank)", "text"], ["date", "Date", "date"]] },
        users: { title: "User Management", description: "Manage staff records used in operational reporting.", fields: [["name", "Staff name", "text"], ["role", "Role", "text"], ["phone", "Phone number", "tel"]] },
        reports: { title: "Reports", description: "Review recorded sales, inventory, and expenses.", fields: [] }
      };

      function renderEntity(key) {
        const config = entityConfig[key];
        if (key === "reports") {
          const sales = state.invoices.reduce((sum, item) => sum + Number(item.total || 0), 0);
          const paid = state.invoices.reduce((sum, item) => sum + Number(item.amountPaid || 0), 0);
          const expenses = state.expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
          return heading("Reports", "Summary of recorded business activity.") +
            `<section class="stats">${stat("Total sales", money(sales))}${stat("Total deposits", money(paid))}${stat("Outstanding credit", money(sales - paid))}${stat("Total expenses", money(expenses))}</section><section class="panel"><div class="panel-head"><div><h2>Recent invoices</h2><p>Recorded sales transactions</p></div><button class="btn" data-page="invoices">Manage invoices</button></div>${table(["Invoice ID", "Customer", "Date", "Total", "Paid"], state.invoices.slice(-10).reverse().map(x => row([esc(x.invoiceId), esc(x.customer), dateLabel(x.date), money(x.total), money(x.amountPaid)])))}</section>`;
        }
        const records = state[key] || [];
        const columns = config.fields.map(field => field[1]);
        const rows = records.map((item, index) => row([index + 1, ...config.fields.map(([name]) => name === "salePrice" || name === "balance" || name === "amount" ? money(item[name]) : esc(name === "date" ? dateLabel(item[name]) : item[name])), `<button class="btn" data-action="edit-entity" data-type="${key}" data-id="${esc(item.id)}">Edit</button> <button class="btn danger" data-action="delete-entity" data-type="${key}" data-id="${esc(item.id)}">Delete</button>`]));
        return heading(config.title, config.description, `<button class="btn primary" data-action="add-entity" data-type="${key}">Add ${key === "users" ? "Staff" : config.title.slice(0, -1)}</button>`) +
          `<section class="panel entity-table"><div class="panel-head"><div><h2>All ${esc(config.title.toLowerCase())}</h2><p>${records.length} ${esc(config.title.toLowerCase())} recorded</p></div></div>${table(["S/N", ...columns, "Options"], rows, `No ${config.title.toLowerCase()} have been added.`)}</section>`;
      }

      function renderAllocations() {
        const rows = state.allocations.map((item, index) => row([index + 1, esc(item.material), esc(item.factory), n.format(item.quantityKg), dateLabel(item.date), money(item.cost)]));
        return heading("Allocate RM to Factory", "Issue raw material from a store to production.") +
          `<section class="panel"><form class="form-grid" id="allocation-form"><label class="field">Raw material<select class="control" name="material" required><option value="">Select material</option>${state.materials.map(x => `<option>${esc(x.name)}</option>`).join("")}</select></label><label class="field">Factory / line<input class="control" name="factory" required placeholder="Factory"></label><label class="field">Quantity (kg)<input class="control" name="quantityKg" type="number" min="0.01" step="0.01" required></label><button class="btn primary">Allocate RM</button></form>${table(["S/N", "Material", "Factory", "Quantity (kg)", "Date", "Cost"], rows)}</section>`;
      }

      function renderFactory() {
        const rows = state.allocations.map((item,index) => row([index + 1, esc(item.factory), esc(item.material), n.format(item.quantityKg), dateLabel(item.date)]));
        return heading("Factory", "Review raw materials allocated to production.") + `<section class="panel">${table(["S/N", "Factory", "Material", "Quantity (kg)", "Date"], rows)}</section>`;
      }

      function renderQuality() {
        const rows = state.qualityChecks.map((item,index) => row([index + 1, esc(item.batch), esc(item.check), esc(item.result), dateLabel(item.date)]));
        return heading("Quality Control", "Record production and product quality checks.", `<button class="btn primary" data-action="add-quality">Add Quality Check</button>`) + `<section class="panel">${table(["S/N", "Batch / product", "Quality check", "Result", "Date"], rows)}</section>`;
      }

      function renderSettings() {
        return heading("Settings", "Local MONAS workspace preferences.") + `<section class="panel"><div class="panel-head"><div><h2>Workspace</h2><p>MONAS Table Water · ${currentUser.role === "admin" ? "Administrator" : "Manager"} view</p></div></div><p class="hint">This version stores operational records in this browser only. It does not connect to a server or provide real account authentication. Export your browser data before clearing it.</p><div class="toolbar"><button class="btn" data-action="export-data">Export data backup</button><label class="btn">Import backup<input type="file" id="import-data" accept="application/json,.json" hidden></label><button class="btn danger" data-action="logout">Log out</button></div></section>`;
      }

      function render() {
        navMarkup();
        const pages = {
          dashboard: renderDashboard, sales: renderSales, invoices: renderInvoices,
          "raw-materials": renderMaterials, stores: renderStores, allocations: renderAllocations,
          factory: renderFactory, quality: renderQuality, settings: renderSettings
        };
        view.innerHTML = pages[currentPage] ? pages[currentPage]() : renderEntity(currentPage);
        document.querySelector("#welcome-user").innerHTML = `${esc(currentUser.name)}<small>${currentUser.role === "admin" ? "Administrator" : "Manager"}</small>`;
        document.querySelector("#user-avatar").textContent = currentUser.name.trim().charAt(0).toUpperCase() || "M";
      }

      function fieldMarkup([name, label, type, options], value = "") {
        const required = ["name", "type", "status", "salePrice", "stock", "amount", "date", "method", "role", "quantityKg", "pricePerKg", "location", "factory", "batch", "check", "result"].includes(name);
        const input = options
          ? `<select name="${esc(name)}" ${required ? "required" : ""}>${options.map(([optionValue, optionLabel]) => `<option value="${esc(optionValue)}" ${value === optionValue ? "selected" : ""}>${esc(optionLabel)}</option>`).join("")}</select>`
          : type === "textarea"
            ? `<textarea name="${esc(name)}" ${required ? "required" : ""}>${esc(value)}</textarea>`
            : `<input name="${esc(name)}" type="${esc(type)}" ${type === "number" ? 'min="0" step="0.01"' : ""} value="${esc(value)}" ${required ? "required" : ""}>`;
        return `<label class="field">${esc(label)}${input}</label>`;
      }

      function openModal(title, fields, existing, save) {
        modalSave = save;
        document.querySelector("#modal-title").textContent = title;
        document.querySelector("#modal-fields").innerHTML = fields.map(field => fieldMarkup(field, existing?.[field[0]] ?? "")).join("");
        dialog.showModal();
        dialog.querySelector("input,select")?.focus();
      }

      function closeModal() {
        dialog.close();
        modalSave = null;
      }

      function addOrEditEntity(key, record) {
        const config = entityConfig[key];
        const fields = config.fields;
        openModal(`${record ? "Edit" : "Add"} ${key === "users" ? "staff" : config.title.toLowerCase().replace(/s$/, "")}`, fields, record, values => {
          const item = { ...(record || {}), ...values, id: record?.id || id() };
          if (key === "expenses" && !item.date) item.date = today;
          if (record) state[key] = state[key].map(value => value.id === record.id ? item : value);
          else state[key].push(item);
          if (persist()) { closeModal(); render(); notify(record ? "Record updated." : "Record added."); }
        });
      }

      function addMaterial(record) {
        const fields = [["name", "Material name", "text"], ["quantityKg", "Quantity (kg)", "number"], ["pricePerKg", "Price per kg (₦)", "number"], ["location", "Store / location", "text"]];
        openModal(`${record ? "Edit" : "Add"} raw material`, fields, record, values => {
          const item = { ...values, quantityKg: Number(values.quantityKg), pricePerKg: Number(values.pricePerKg), id: record?.id || id() };
          if (record) state.materials = state.materials.map(value => value.id === record.id ? item : value);
          else state.materials.push(item);
          if (persist()) { closeModal(); render(); notify(record ? "Raw material updated." : "Raw material added."); }
        });
      }

      function printInvoice(invoice) {
        const printWindow = window.open("", "_blank");
        if (!printWindow) { notify("Allow pop-ups to print this invoice.", true); return; }
        printWindow.opener = null;
        const lines = invoice.items.map(item => `<tr><td>${esc(item.name)}</td><td>${n.format(item.quantity)}</td><td>${money(item.price)}</td><td>${money(item.quantity * item.price)}</td></tr>`).join("");
        printWindow.document.write(`<!doctype html><html><head><title>${esc(invoice.invoiceId)}</title><style>body{font:14px Arial;padding:35px;color:#24334c}h1{text-align:center}table{width:100%;border-collapse:collapse;margin:24px 0}td,th{border:1px solid #ccd3df;padding:10px;text-align:left}.total{text-align:right;font-weight:bold}</style></head><body><h1>MONAS TABLE WATER</h1><h2>Invoice ${esc(invoice.invoiceId)}</h2><p>Customer: ${esc(invoice.customer)} | Date: ${dateLabel(invoice.date)}</p><table><thead><tr><th>Product</th><th>Quantity</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${lines}</tbody></table><p class="total">Total: ${money(invoice.total)}<br>Amount paid: ${money(invoice.amountPaid)}<br>Payment: ${esc(invoice.paymentMethod)}</p></${"body"}></${"html"}>`);
        printWindow.document.close();
        setTimeout(() => { printWindow.focus(); printWindow.print(); }, 100);
      }

      function handleAction(button) {
        const action = button.dataset.action;
        const recordId = button.dataset.id;
        if (action === "add-material") return addMaterial();
        if (action === "edit-material") {
          const record = state.materials.find(x => x.id === recordId);
          if (!record) return;
          openModal("Raw material actions", [["name", "Material name", "text"], ["quantityKg", "Quantity (kg)", "number"], ["pricePerKg", "Price per kg (₦)", "number"], ["location", "Store / location", "text"]], record, values => {
            state.materials = state.materials.map(item => item.id === record.id ? { ...values, quantityKg: Number(values.quantityKg), pricePerKg: Number(values.pricePerKg), id: record.id } : item);
            if (persist()) { closeModal(); render(); notify("Raw material updated."); }
          });
          return;
        }
        if (action === "delete-material") {
          if (!window.confirm("Delete this raw material record? This cannot be undone.")) return;
          state.materials = state.materials.filter(item => item.id !== recordId);
          commit("Raw material deleted.");
          return;
        }
        if (action === "add-store" || action === "edit-store") {
          const record = action === "edit-store" ? state.stores.find(x => x.id === recordId) : null;
          const fields = [
            ["name", "Store name", "text"],
            ["type", "Store type", "select", [["finished", "Finished product"], ["raw", "Raw material"]]],
            ["keeper", "Store keeper", "text"],
            ["status", "Status", "select", [["active", "Active"], ["inactive", "Inactive"]]],
            ["description", "Description", "textarea"]
          ];
          openModal(`${record ? "Edit" : "Add"} store`, fields, record, values => {
            const now = stamp();
            const item = { ...values, id: record?.id || id(), createdAt: record?.createdAt || now, updatedAt: now };
            if (record) state.stores = state.stores.map(x => x.id === record.id ? item : x); else state.stores.push(item);
            if (persist()) { closeModal(); render(); notify("Store saved."); }
          });
          return;
        }
        if (action === "export-stores") {
          const columns = ["Store name", "Store type", "Store keeper", "Status", "Description", "Created", "Last updated"];
          const csvCell = value => `"${String(value ?? "").replaceAll('"', '""')}"`;
          const records = state.stores.map(item => [
            item.name, item.type === "finished" ? "Finished product" : "Raw material",
            item.keeper, item.status, item.description, item.createdAt, item.updatedAt
          ]);
          const blob = new Blob(["\uFEFF", [columns, ...records].map(record => record.map(csvCell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "monas-stores.csv";
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          notify(`Exported ${state.stores.length} stores to CSV.`);
          return;
        }
        if (action === "delete-store" || action === "delete-entity") {
          const collection = action === "delete-store" ? "stores" : button.dataset.type;
          if (!window.confirm("Delete this record? This cannot be undone.")) return;
          state[collection] = state[collection].filter(x => x.id !== recordId);
          commit("Record deleted.");
          return;
        }
        if (action === "add-entity" || action === "edit-entity") {
          const key = button.dataset.type;
          const record = action === "edit-entity" ? state[key].find(x => x.id === recordId) : null;
          addOrEditEntity(key, record);
          return;
        }
        if (action === "remove-cart") {
          cart.splice(Number(button.dataset.index), 1);
          render();
          return;
        }
        if (action === "print-invoice") {
          const invoice = state.invoices.find(x => x.id === recordId);
          if (invoice) printInvoice(invoice);
          return;
        }
        if (action === "add-quality") {
          openModal("Add quality check", [["batch", "Batch / product", "text"], ["check", "Quality check", "text"], ["result", "Result", "text"]], null, values => {
            state.qualityChecks.push({ ...values, date: today, id: id() });
            if (persist()) { closeModal(); render(); notify("Quality check saved."); }
          });
          return;
        }
        if (action === "export-data") {
          const blob = new Blob([JSON.stringify({ format: "monas-operations", version: 1, exportedAt: stamp(), state }, null, 2)], { type: "application/json" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "monas-operations-backup.json";
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          notify("Data backup exported.");
          return;
        }
        if (action === "logout") logout();
      }

      function addCartItem() {
        const select = document.querySelector("#sale-product");
        const product = state.products.find(item => item.id === select.value);
        const quantity = Number(document.querySelector("#sale-quantity").value);
        const price = Number(document.querySelector("#sale-price").value);
        const store = document.querySelector("#sale-store").value;
        if (!product || !store || !Number.isFinite(quantity) || quantity <= 0 || !Number.isFinite(price) || price < 0) {
          notify("Select a product and store, then enter a valid quantity and sale price.", true);
          return;
        }
        if (product.stock !== "" && Number.isFinite(Number(product.stock)) && quantity > Number(product.stock)) {
          notify("The requested quantity exceeds the product stock.", true);
          return;
        }
        cart.push({ productId: product.id, name: product.name, quantity, price, store });
        render();
      }

      function submitSale() {
        const customer = document.querySelector("#sale-customer").value;
        const total = cart.reduce((sum, item) => sum + item.quantity * item.price, 0);
        const amountPaidInput = document.querySelector("#sale-paid").value;
        const amountPaid = amountPaidInput === "" ? total : Number(amountPaidInput);
        if (!cart.length || !customer) { notify("Add products to the cart and select a customer.", true); return; }
        if (!Number.isFinite(amountPaid) || amountPaid < 0 || amountPaid > total) { notify("Enter a valid payment amount not greater than the invoice total.", true); return; }
        const invoice = {
          id: id(), invoiceId: `MON-${Date.now().toString().slice(-8)}`, customer, date: stamp(), total,
          amountPaid, paymentMethod: document.querySelector("#sale-method").value, user: currentUser.name,
          items: cart.map(item => ({ ...item }))
        };
        state.invoices.push(invoice);
        for (const item of cart) {
          const product = state.products.find(value => value.id === item.productId);
          if (product && product.stock !== "" && Number.isFinite(Number(product.stock))) product.stock = Math.max(0, Number(product.stock) - item.quantity);
        }
        if (persist()) { cart = []; saleCustomer = ""; saleAmountPaid = ""; currentPage = "invoices"; render(); notify("Sale saved and invoice created."); }
      }

      function handlePageInput(target) {
        if (target.id === "sale-product") {
          const selected = target.selectedOptions[0];
          const price = Number(selected?.dataset.price || 0);
          document.querySelector("#sale-price").value = price || "";
          updateSaleTotal();
        }
        if (target.id === "sale-quantity" || target.id === "sale-price") updateSaleTotal();
        if (target.id === "sale-customer") saleCustomer = target.value;
        if (target.id === "sale-paid") saleAmountPaid = target.value;
        if (target.dataset.tableSearch === "materials") {
          const query = target.value.toLowerCase();
          document.querySelectorAll("#materials-table tbody tr").forEach(tr => { tr.hidden = !tr.textContent.toLowerCase().includes(query); });
        }
        if (target.dataset.tableSearch === "stores") {
          const query = target.value.toLowerCase();
          document.querySelectorAll("tr[data-store-search]").forEach(tr => { tr.hidden = !tr.dataset.storeSearch.includes(query); });
        }
        if (target.id === "invoice-search") applyInvoiceFilters();
      }

      function updateSaleTotal() {
        const quantity = Number(document.querySelector("#sale-quantity")?.value || 0);
        const price = Number(document.querySelector("#sale-price")?.value || 0);
        const total = document.querySelector("#sale-line-total");
        if (total) total.value = money(quantity * price);
      }

      function applyInvoiceFilters() {
        const query = document.querySelector("#invoice-search")?.value.toLowerCase() || "";
        const start = document.querySelector("#invoice-start")?.value || "";
        const end = document.querySelector("#invoice-end")?.value || "";
        document.querySelectorAll("#invoice-table tbody tr").forEach(tr => {
          const text = tr.textContent.toLowerCase();
          const day = tr.dataset.date || "";
          if (!day) return;
          tr.hidden = (query && !text.includes(query)) || (start && day < start) || (end && day > end);
        });
      }

      function logout() {
        sessionStorage.removeItem(SESSION_KEY);
        closeSidebar();
        document.querySelector("#app").hidden = true;
        document.querySelector("#login-screen").hidden = false;
        document.querySelector("#login-password").value = "";
      }

      function openSidebar() {
        if (window.matchMedia("(max-width: 760px)").matches) {
          document.querySelector("#app").classList.add("sidebar-open");
          document.querySelector("#sidebar-scrim").hidden = false;
          document.querySelector("#sidebar-toggle").setAttribute("aria-expanded", "true");
        }
      }

      function closeSidebar() {
        document.querySelector("#app").classList.remove("sidebar-open");
        document.querySelector("#sidebar-scrim").hidden = true;
        document.querySelector("#sidebar-toggle").setAttribute("aria-expanded", "false");
      }

      function enterApp(session) {
        currentUser = session;
        document.querySelector("#login-screen").hidden = true;
        document.querySelector("#app").hidden = false;
        currentPage = "dashboard";
        render();
      }

      document.querySelector("#login-form").addEventListener("submit", event => {
        event.preventDefault();
        const username = document.querySelector("#login-username").value.trim();
        const password = document.querySelector("#login-password").value;
        const account = ACCOUNTS.find(item => item.username === username && item.password === password);
        if (!account) {
          const error = document.querySelector("#login-error");
          error.textContent = "Incorrect username or password.";
          error.hidden = false;
          document.querySelector("#login-password").value = "";
          document.querySelector("#login-password").focus();
          return;
        }
        const session = { name: account.name, role: account.role };
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
        document.querySelector("#login-error").hidden = true;
        enterApp(session);
      });

      document.querySelector("#logout-button").addEventListener("click", logout);
      document.querySelector("#sidebar-toggle").addEventListener("click", () => {
        document.querySelector("#app").classList.contains("sidebar-open") ? closeSidebar() : openSidebar();
      });
      document.querySelector("#sidebar-scrim").addEventListener("click", closeSidebar);
      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 760px)").matches) closeSidebar();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeSidebar();
      });
      nav.addEventListener("click", event => {
        const button = event.target.closest("[data-page]");
        if (!button) return;
        currentPage = button.dataset.page;
        if (currentPage !== "sales") { cart = []; saleCustomer = ""; saleAmountPaid = ""; }
        render();
        closeSidebar();
      });
      view.addEventListener("click", event => {
        const button = event.target.closest("[data-action], [data-page], #add-to-cart, #submit-sale, #invoice-search-button");
        if (!button) return;
        if (button.dataset.page) { currentPage = button.dataset.page; render(); return; }
        if (button.id === "add-to-cart") return addCartItem();
        if (button.id === "submit-sale") return submitSale();
        if (button.id === "invoice-search-button") return applyInvoiceFilters();
        handleAction(button);
      });
      view.addEventListener("input", event => handlePageInput(event.target));
      view.addEventListener("change", event => handlePageInput(event.target));
      view.addEventListener("submit", event => {
        if (event.target.id !== "allocation-form") return;
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.target));
        const material = state.materials.find(x => x.name === values.material);
        const quantityKg = Number(values.quantityKg);
        if (!material || quantityKg <= 0 || quantityKg > Number(material.quantityKg)) {
          notify("Choose a material and enter a quantity available in stock.", true);
          return;
        }
        material.quantityKg = Number(material.quantityKg) - quantityKg;
        state.allocations.push({ id: id(), material: material.name, factory: values.factory, quantityKg, date: today, cost: quantityKg * Number(material.pricePerKg) });
        commit("Raw material allocated to factory.");
      });
      document.querySelector("#record-form").addEventListener("submit", event => {
        event.preventDefault();
        if (modalSave) modalSave(Object.fromEntries(new FormData(event.target)));
      });
      document.querySelector("#record-form").addEventListener("click", event => {
        if (event.target.closest("[data-close-modal]")) closeModal();
      });
      document.querySelector("#record-dialog").addEventListener("close", () => { modalSave = null; });
      document.querySelector("#view").addEventListener("change", event => {
        if (event.target.id !== "import-data" || !event.target.files?.[0]) return;
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          try {
            const data = JSON.parse(String(reader.result));
            const imported = data?.format === "monas-operations" && data.version === 1 ? data.state : null;
            if (!imported || !Object.keys(blankState()).every(key => Array.isArray(imported[key]))) throw new Error("This is not a valid MONAS operations backup.");
            const previous = state;
            state = imported;
            if (!persist()) state = previous;
            else { render(); notify("Backup restored."); }
          } catch (error) {
            console.error("Could not import MONAS backup:", error);
            notify(error.message || "Could not import this backup.", true);
          }
          event.target.value = "";
        });
        reader.addEventListener("error", () => notify("Could not read the backup file.", true), { once: true });
        reader.readAsText(event.target.files[0]);
      });

      loadState();
      try {
        const session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
        if (session && typeof session.name === "string" && ["admin", "manager"].includes(session.role)) enterApp(session);
      } catch (error) {
        console.error("Could not restore local session:", error);
        sessionStorage.removeItem(SESSION_KEY);
      }
    })();
  </script>
</body>
</html>
